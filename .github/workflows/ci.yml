# ═══════════════════════════════════════════════════════════════════════════════
# Shared CI/CD Pipeline — Yggdrasil Platform
# Called by all project repos via workflow_call
# Repo: kschmidtlarsen/.github
# ═══════════════════════════════════════════════════════════════════════════════

name: Shared CI Pipeline

on:
  workflow_call:
    inputs:
      # ── Project identity ──────────────────────────────
      project-id:
        description: 'Forseti project ID (e.g. kanban, mimir, calify)'
        required: true
        type: string

      # ── Node / install ────────────────────────────────
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Directory containing package.json'
        required: false
        type: string
        default: 'backend'

      # ── Database ──────────────────────────────────────
      needs-postgres:
        description: 'Whether tests need a PostgreSQL service'
        required: false
        type: boolean
        default: true
      postgres-version:
        description: 'PostgreSQL Docker image version'
        required: false
        type: string
        default: '17'
      db-name:
        description: 'Test database name'
        required: false
        type: string
        default: 'test_db'
      db-user:
        description: 'Test database user'
        required: false
        type: string
        default: 'test_user'
      db-password:
        description: 'Test database password'
        required: false
        type: string
        default: 'testpassword'
      db-init-command:
        description: 'Command to initialize the database (run in working-directory). Empty = skip.'
        required: false
        type: string
        default: ''

      # ── Test configuration ────────────────────────────
      test-command:
        description: 'Unit test command'
        required: false
        type: string
        default: 'npm test -- --coverage --coverageReporters=lcov'
      lint-hard-fail:
        description: 'Whether lint failure should fail the build'
        required: false
        type: boolean
        default: false
      run-npm-audit:
        description: 'Run npm audit step'
        required: false
        type: boolean
        default: true
      fix-coverage-paths:
        description: 'Fix coverage lcov paths for SonarCloud (prefix with working-directory)'
        required: false
        type: boolean
        default: false

      # ── E2E Tests ─────────────────────────────────────
      run-e2e:
        description: 'Run Playwright E2E tests'
        required: false
        type: boolean
        default: true
      e2e-grep:
        description: 'Playwright --grep filter (e.g. @smoke). Empty = run all.'
        required: false
        type: string
        default: ''
      cache-playwright:
        description: 'Cache Playwright browser binaries'
        required: false
        type: boolean
        default: true

      # ── Docker build ──────────────────────────────────
      build-docker:
        description: 'Build and push Docker image to GHCR'
        required: false
        type: boolean
        default: true
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: 'Dockerfile.yggdrasil'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Build & Push Docker (only job — tests run via Forseti weekly sweeps)
  # The 'test' job was removed 2026-05-16 (forseti card-a83afc83).
  # Lint/jest/e2e/sonar/npm-audit now execute on Forseti's per-project cadence
  # against the deployed instance. Push-to-deploy stays fast (~90s).
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: Build & Push Docker
    if: inputs.build-docker && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
